receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  file/traces:
    path: /var/otel/traces.json
  file/metrics:
    path: /var/otel/metrics.json
  file/logs:
    path: /var/otel/logs.json
  otlp/jaeger:
    endpoint: jaeger:4317 # internal Docker network port, not the host mapping!
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [file/traces, otlp/jaeger] #fanning out to both exporter
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      exporters: [file/logs]