spring:
  application:
    name: jpmc-spring-june-2025-day-2
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:./rest-demo;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect


otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
  logs:
    exporter: otlp
  traces:
    exporter: otlp
    sampler: always_on  # 100% of traces are sampled during dev
  metrics:
    exemplar:
      filter: TRACE_BASED

management:
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics  # Micrometer's OTLP registry only supports HTTP, not gRPC
        step: 10s
      
  endpoints:
    web:
      exposure:
        include: 
          - health
          - metrics
          - prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
        customers:
          getall:
            time: true
          create:
            time: true
  tracing:
    sampling:
      probability: 1.0