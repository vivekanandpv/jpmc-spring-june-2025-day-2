spring:
  application:
    name: jpmc-spring-june-2025-day-2
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:./rest-demo;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    open-in-view: false


otel:
  exporter:
    otlp:
      endpoint: http://localhost:4317
      protocol: grpc
  traces:
    exporter: otlp
    sampler: always_on
  logs:
    exporter: otlp
  resource:
    attributes:
      service.name: jpmc-spring-june-2025-day-2

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include:
          - health
          - metrics
          - prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
        customers:
          getall:
            time: true
    export:
      otlp:
        url: http://localhost:4318/v1/metrics
        step: 10s
      
  
